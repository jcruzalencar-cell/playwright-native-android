name: Atualizar Repositório APT com Múltiplos Pacotes

on:
  push:
    branches:
      - main
    paths:
      - '**.deb'
      - 'input-debs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o Repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Ferramenta do Repositório Termux
        run: |
          pip install termux-apt-repo

      - name: Reconstruir Índices APT para Todos os Pacotes
        run: |
          mkdir -p input-debs
          
          # Move todos os .deb soltos na raiz para dentro de input-debs (se houver)
          find . -maxdepth 1 -name "*.deb" -exec mv {} input-debs/ \;
          
          # Remove as pastas antigas para reconstruir os índices limpos com todos os pacotes reunidos
          rm -rf dists/ pool/
          
          # Roda o gerador apontando para a pasta de entradas
          termux-apt-repo input-debs .

      - name: Enviar Alterações Atualizadas para o GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add dists/ pool/ input-debs/
          git status
          git diff --staged --quiet || git commit -m "🤖 Atualização automática: indexando múltiplos pacotes .deb"
          git push
